apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: himatsumu-ai-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: himatsumu-ai-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
