name: AI CI/CD

on:
    push:
        branches:
            - 'develop'

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.prepare_name.outputs.IMAGE_NAME }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Prepare image name
              id: prepare_name
              run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

            - name: Login to container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: ./Dockerfile.prod
                push: true
                tags: |
                  ${{ env.REGISTRY }}/${{ steps.prepare_name.outputs.IMAGE_NAME }}:latest
                  ${{ env.REGISTRY }}/${{ steps.prepare_name.outputs.IMAGE_NAME }}:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: self-hosted

        steps:
            - name: Deploy to production
              uses: docker/metadata-action@v4
              with:
                  images: ${{ needs.build-and-push.outputs.image }}
